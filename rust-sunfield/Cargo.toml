[package]
name = "sunfield_wasm"
version = "0.1.0"
edition = "2021"
description = "Solar magnetic field-line tracer (PFSS-lite) — buried-dipole superposition + RK4 streamline integration, compiled to WebAssembly for sun.html"

[lib]
# cdylib → the WASM artifact the browser loads; rlib → `cargo test`, which is
# how the loop-geometry gate in tests/ runs at all (a cdylib-only crate has no
# target the test harness can link against).
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
