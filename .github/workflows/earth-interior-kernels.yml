# earth-interior-kernels — the Inner Earth model's pure kernels (INNER_EARTH_PLAN.md)
#
#   earth-interior-prem.mjs   PREM vs ObsPy's TauP node table (both sides of
#                             every jump, transcription-slip negative control),
#                             mass / C/MR² re-integrated independently and
#                             against the measured Earth (mantle-density-core
#                             negative control), DA81's printed g and p, the
#                             jump list; Grayver 2017 σ(r) vs the pinned
#                             ChaosMagPy file; the 1-D plane-wave impedance vs
#                             closed forms (half-space, split layer, thin sheet)
#   earth-interior-geoelectric.mjs  the baked 1-D ground columns (builder --check,
#                             pins, Quebec vs TPL-007 Table 4), the exact causal
#                             kernel (half-space closed form + Stehfest on layered
#                             columns), sign by Poynting flux, sinusoid error
#                             budget, warm-up, gaps, TPL-007 β ranking, the
#                             nowcast, and the relay's `y` passthrough
name: earth-interior-kernels

on:
  push:
    paths:
      - 'data/earth-interior/**'
      - 'scripts/build-ground-models.mjs'
      - 'api/geomag/observatories.js'
      - 'js/geomag/**'
      - 'js/frequency-analysis.js'
      - 'js/earth-interior/**'
      - 'tests/earth-interior-*.mjs'
      - 'tests/fixtures/earth-interior/**'
      - '.github/workflows/earth-interior-kernels.yml'
  pull_request:
    paths:
      - 'data/earth-interior/**'
      - 'scripts/build-ground-models.mjs'
      - 'api/geomag/observatories.js'
      - 'js/geomag/**'
      - 'js/frequency-analysis.js'
      - 'js/earth-interior/**'
      - 'tests/earth-interior-*.mjs'
      - 'tests/fixtures/earth-interior/**'
      - '.github/workflows/earth-interior-kernels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earth-interior-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernels:
    name: PREM, conductivity, geoelectric kernels (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PREM + conductivity
        run: node tests/earth-interior-prem.mjs
      - name: ground-model bake is current
        run: node scripts/build-ground-models.mjs --check
      - name: geoelectric kernel + nowcast
        run: node tests/earth-interior-geoelectric.mjs
