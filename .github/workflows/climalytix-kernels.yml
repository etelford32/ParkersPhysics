# climalytix-kernels — the Climalytix SiteSeries store, catalogue, timeline
# model and archive route (CLIMALYTIX_PLAN.md §13 P0).
#
#   climalytix-series.mjs    the SiteSeries contract + agg-aware resampler: gaps
#                            stay gaps, agg is required, never upsample, sparse
#                            buckets are gaps, station-local day buckets,
#                            alignment by instant
#   climalytix-catalog.mjs   the dataset table and the four pure adapters (the
#                            station adapter is fed the Climate Lab's OWN fixture
#                            through the lab's OWN normaliser), the workspace
#                            normaliser
#   climalytix-timeline.mjs  past solid / future dashed, gaps break lines, long
#                            windows aggregate (a max stays a max), one bucket
#                            for every sum in a panel, "too short for this zoom"
#   climalytix-archive.mjs   /api/climalytix/archive on stubbed fetch: snapped
#                            cache key, SI units pinned, every degraded upstream
#                            is 200 + expired (never a 5xx), bad input 400
#   climalytix-point-tile.mjs  the tile READER against the fixture the Python
#                            WRITER produced from a real GFS message — same bytes,
#                            same bilinear values, the seam halo, gap corners
#   climalytix-map-view.mjs  the location map's geometry: zoom at the cursor is
#                            exact, a clamped zoom never pans, GIBS' real 288/2^z
#                            tile grid across the dateline, heat = the site-wide
#                            temperature LUT bytes, gaps transparent
#   climalytix-nwp-route.mjs /api/climalytix/nwp on a fake R2 bucket: two range
#                            reads per site, every degraded path 200 + freshness
#   climalytix_ingest_test.py  the ingest worker (python): real .idx parsing,
#                            precip de-accumulation across reset buckets, every
#                            GRIB scan mode against eccodes' own coordinates
#   climate-lab.mjs          Climalytix imports the lab's units / feed / home
#                            modules — the lab's gate must keep passing UNCHANGED
#
# Browser gates (tests/climalytix-smoke.spec.js with its all-feeds-down
# negative control; tests/climalytix-map.spec.js with its heat-off control)
# run with the Playwright suite.
name: climalytix-kernels

on:
  push:
    paths:
      - 'js/climalytix/**'
      - 'js/climate-lab/**'
      - 'js/earth-detail-inset.js'
      - 'js/temp-ramp.js'
      - 'api/_lib/climalytix-r2.js'
      - 'api/climalytix/**'
      - 'scripts/climalytix_ingest/**'
      - 'tests/climalytix_ingest_test.py'
      - 'tests/fixtures/climalytix/**'
      - 'climalytix.html'
      - 'tests/climalytix-*.mjs'
      - 'tests/fixtures/climalytix-mocks.mjs'
      - '.github/workflows/climalytix-kernels.yml'
  pull_request:
    paths:
      - 'js/climalytix/**'
      - 'js/climate-lab/**'
      - 'js/earth-detail-inset.js'
      - 'js/temp-ramp.js'
      - 'api/_lib/climalytix-r2.js'
      - 'api/climalytix/**'
      - 'scripts/climalytix_ingest/**'
      - 'tests/climalytix_ingest_test.py'
      - 'tests/fixtures/climalytix/**'
      - 'climalytix.html'
      - 'tests/climalytix-*.mjs'
      - 'tests/fixtures/climalytix-mocks.mjs'
      - '.github/workflows/climalytix-kernels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climalytix-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernels:
    name: Climalytix kernels + archive route (node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SiteSeries store + resampler
        run: node tests/climalytix-series.mjs
      - name: catalogue + adapters + workspace
        run: node tests/climalytix-catalog.mjs
      - name: timeline model
        run: node tests/climalytix-timeline.mjs
      - name: archive route
        run: node tests/climalytix-archive.mjs
      - name: point-tile reader (JS ↔ Python fixture)
        run: node tests/climalytix-point-tile.mjs
      - name: location map geometry
        run: node tests/climalytix-map-view.mjs
      - name: nwp route (fake R2)
        run: node tests/climalytix-nwp-route.mjs
      - name: Climate Lab (unchanged by the lift)
        run: node tests/climate-lab.mjs
      - name: pipeline registry
        run: node tests/pipeline-registry.mjs

  ingest:
    name: Ingest worker (python, real GFS fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'eccodes==2.50.0' 'numpy>=2'
      - run: python3 tests/climalytix_ingest_test.py
