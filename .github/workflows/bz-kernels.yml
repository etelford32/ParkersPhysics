# Node gate for the Bz analysis engine (BZ_ENGINE_PLAN.md).
#
#   bz-feeds.mjs   js/bz/feeds.js + api/bz/feeds.js — the feed catalogue and
#                  normalisers: gaps are null, spacecraft stay separate, cadence
#                  is measured, candidates walk in order, a dead upstream is
#                  200 + freshness:expired (never a 5xx), no passthrough URL
#   bz-l1.mjs      js/bz/{frames,fuse-l1,spectrum,l1-analysis}.js + api/bz/l1.js —
#                  against a PLANTED tilted solar wind: lags recovered, the lag
#                  track is causal, the fused field beats one spacecraft and the
#                  naive mean is the negative control, a glitching spacecraft is
#                  blamed and excluded, Parseval holds, the GSE→GSM angle
#                  reproduces production
name: bz-kernels

on:
  push:
    paths:
      - 'js/bz/**'
      - 'js/bz-engine-provider.js'
      - 'js/bz-page.js'
      - 'data/bz/**'
      - 'api/cron/bz-archive.js'
      - 'api/bz/**'
      - 'vercel.json'
      - 'scripts/bz-hindcast.mjs'
      - 'js/bz-planet-canvas.js'
      - 'js/flux-rope-forecast.js'
      - 'bz.html'
      - 'js/ring-current-model.js'
      - 'js/geomag/dipole.js'
      - 'js/geomag/geospace.js'
      - 'js/geomag/igrf.js'
      - 'js/geomag/observatories.js'
      - 'api/_lib/bz-ground-fetch.js'
      - 'tests/helpers/bz-planted-ground.mjs'
      - 'tests/helpers/bz-planted-wind.mjs'
      - 'js/flux-rope-noise.js'
      - 'api/_lib/bz-fetch.js'
      - 'api/bz/**'
      - 'tests/bz-*.mjs'
      - 'tests/fixtures/bz/**'
      - 'scripts/probe-bz-feeds.mjs'
      - '.github/workflows/bz-kernels.yml'
  pull_request:
    paths:
      - 'js/bz/**'
      - 'js/bz-engine-provider.js'
      - 'js/bz-page.js'
      - 'data/bz/**'
      - 'api/cron/bz-archive.js'
      - 'api/bz/**'
      - 'vercel.json'
      - 'scripts/bz-hindcast.mjs'
      - 'js/bz-planet-canvas.js'
      - 'js/flux-rope-forecast.js'
      - 'bz.html'
      - 'js/ring-current-model.js'
      - 'js/geomag/dipole.js'
      - 'js/geomag/geospace.js'
      - 'js/geomag/igrf.js'
      - 'js/geomag/observatories.js'
      - 'api/_lib/bz-ground-fetch.js'
      - 'tests/helpers/bz-planted-ground.mjs'
      - 'tests/helpers/bz-planted-wind.mjs'
      - 'js/flux-rope-noise.js'
      - 'api/_lib/bz-fetch.js'
      - 'api/bz/**'
      - 'tests/bz-*.mjs'
      - 'tests/fixtures/bz/**'
      - 'scripts/probe-bz-feeds.mjs'
      - '.github/workflows/bz-kernels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bz-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernels:
    name: Bz engine kernels (node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: feed catalogue + normalisers + route
        run: node tests/bz-feeds.mjs
      - name: L1 rung — frames, multi-spacecraft fusion, spectrum, route
        run: node tests/bz-l1.mjs
      - name: propagation + flux — phase-front delay, coupling functions, route
        run: node tests/bz-flux.mjs
      - name: geosynchronous rung — GOES residual, arcjets, ledger, route
        run: node tests/bz-geo.mjs
      - name: column — shock jump, learning filter (OSSE), ladder, provider, route
        run: node tests/bz-column.mjs
      - name: ground at 1 s — dB/dt, impulses + timing score, equivalent current, ring current, route
        run: node tests/bz-ground.mjs
      - name: bz.html — the page's data model and static contract
        run: node tests/bz-page.mjs
      - name: the hero canvas — scene model + renderer contract
        run: node tests/bz-planet.mjs
      - name: B7 — the forecast join past the L1 horizon, on the real flux-rope WASM
        run: node tests/bz-forecast-join.mjs
      - name: the archive hindcast — kernel on a planted world, and the committed result on the real archive
        run: node tests/bz-hindcast.mjs
      - name: the minute archive — format, merge, the cron with an in-memory store, the reader
        run: node tests/bz-archive.mjs
